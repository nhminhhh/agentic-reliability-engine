[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-reliability-engine"
version = "0.1.0"
description = "Production Reliability & Guardrail Framework for Autonomous LLM Agents: Deterministic Replay, Speculative Tool Verification, and Self-Healing Trajectories."
readme = "README.md"
authors = [
  { name = "nhminhhh", email = "nhatminhn649@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5.0",
  "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]
